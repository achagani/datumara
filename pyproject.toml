[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datumara"
version = "0.1.0"
description = "Datumara analytics model framework for SQL and schema-aware data reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Datumara Team", email = "team@example.com"}
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=5.0.0",
    "peft>=0.4.0",
    "datasets>=2.0.0",
    "sqlparse>=0.4.0",
    "accelerate>=0.12.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.11.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "ruff>=0.0.200",
    "mypy>=0.950",
]
notebook = [
    "jupyter>=1.0.0",
    "notebook>=6.4.0",
    "ipython>=7.30.0",
]

[tool.setuptools]
packages = ["training"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
