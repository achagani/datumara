<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Datumara Logo - Geometric Diamond Design -->
  <defs>
    <linearGradient id="diamondGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#153a31;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e5c4d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Diamond -->
  <polygon points="100,20 180,100 100,180 20,100" 
           fill="url(#diamondGradient)" 
           stroke="#d7f06a" 
           stroke-width="3"/>
  
  <!-- Inner Diamond -->
  <polygon points="100,40 160,100 100,160 40,100" 
           fill="none" 
           stroke="#a9e4c1" 
           stroke-width="2"/>
  
  <!-- Center Diamond -->
  <polygon points="100,60 140,100 100,140 60,100" 
           fill="#d7f06a" 
           opacity="0.8"/>
  
  <!-- Data Points -->
  <circle cx="100" cy="100" r="8" fill="#153a31"/>
  <circle cx="100" cy="70" r="4" fill="#d7f06a"/>
  <circle cx="130" cy="100" r="4" fill="#a9e4c1"/>
  <circle cx="100" cy="130" r="4" fill="#d7f06a"/>
  <circle cx="70" cy="100" r="4" fill="#a9e4c1"/>
</svg>
